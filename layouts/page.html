{{ define "main" }}
<article class="prose">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "blog" }}
    <p class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
      {{ with .Params.topic }} · <span class="topic">{{ . }}</span>{{ end }}
    </p>
    {{ end }}
  </header>
  {{ .Content }}
</article>
{{ end }}
