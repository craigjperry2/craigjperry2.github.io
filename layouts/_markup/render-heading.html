{{- /*
  Headings in Markdown get an id (for the contents list) and, below h1, a quiet # link to themselves.
*/ -}}
<h{{ .Level }} id="{{ .Anchor }}"{{ range $k, $v := .Attributes }}{{ if ne $k "id" }} {{ $k }}="{{ $v }}"{{ end }}{{ end }}>
  {{- .Text -}}
  {{- if ge .Level 2 }} <a class="heading-anchor" href="#{{ .Anchor }}" aria-label="Section link">#</a>{{ end -}}
</h{{ .Level }}>
{{- /**/ -}}
