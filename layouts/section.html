{{ define "main" }}
<div class="prose">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</div>
{{ with .Pages.ByDate.Reverse }}
<ol class="post-list">
  {{ range . }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Params.topic }}<span class="topic">{{ . }}</span>{{ end }}
  </li>
  {{ end }}
</ol>
{{ else }}
<p class="empty">Nothing here yet.</p>
{{ end }}
{{ end }}
